name: Update root index (reusable)

# 由每个 app 的 deploy 工作流在自己部署完成后调用（uses: ./.github/workflows/update-root-index.yml）。
# 这里生成根导航页 index.html，推到 gh-pages 根目录；keep_files: true，不会动各 app 的子目录。
#
# 以后加新 app 的卡片：
#   1. 在下面 index.html 的 <div class="grid"> 里复制一个 <a class="card"> 块；
#   2. href 填该 app 的子目录（= 它 deploy 工作流里的 destination_dir）；
#   3. 新 app 自己写一个 deploy-<app>.yml（照 deploy-skeletonizer.yml），末尾同样调用本工作流。
# 之后任意 app 的下一次部署都会带上这次卡片改动。

on:
  workflow_call:

permissions:
  contents: write

jobs:
  update:
    name: Update root index.html
    runs-on: ubuntu-latest
    steps:
      - name: Generate root index
        run: |
          mkdir -p dist-root
          cat > dist-root/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>codejoo / demos</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                background: #0d1117; color: #e6edf3;
                display: flex; flex-direction: column;
                align-items: center; min-height: 100vh;
                padding: 48px 16px;
              }
              h1 { font-size: 2rem; margin-bottom: 8px; }
              .subtitle { color: #8b949e; margin-bottom: 48px; }
              .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 16px; width: 100%; max-width: 960px;
              }
              a.card {
                display: block; padding: 24px;
                background: #161b22; border: 1px solid #30363d;
                border-radius: 12px; text-decoration: none; color: inherit;
                transition: border-color .2s, transform .15s;
              }
              a.card:hover { border-color: #58a6ff; transform: translateY(-2px); }
              .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; }
              .card-desc  { font-size: .875rem; color: #8b949e; line-height: 1.5; }
              .badge {
                display: inline-block; margin-top: 12px;
                padding: 3px 10px; border-radius: 20px;
                font-size: .75rem; font-weight: 600;
                background: #1f6feb33; color: #58a6ff;
                border: 1px solid #1f6feb;
              }
            </style>
          </head>
          <body>
            <h1>codejoo / demos</h1>
            <p class="subtitle">monorepo 里各个包的在线 demo</p>
            <div class="grid">
              <!-- 新增 app 的卡片：复制下面整个 <a class="card"> 块，改 href（相对路径，= 该 app deploy 工作流的 destination_dir）、标题、描述即可 -->
              <a class="card" href="skeletonizer/">
                <div class="card-title">🦴 skeletonizer</div>
                <div class="card-desc">
                  用真实组件树 + mock 数据生成骨架屏，纯 CSS 推导骨头，多种动效（fade / pulse / shimmer / sweep）。
                </div>
                <span class="badge">Vite 静态 demo</span>
              </a>
            </div>
          </body>
          </html>
          HTML

      - name: Deploy root index.html to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist-root
          keep_files: true
