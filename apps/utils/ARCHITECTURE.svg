<svg viewBox="0 0 1400 950" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="utils-title utils-desc" lang="zh-CN">
  <title id="utils-title">@codejoo/utils 规划架构图</title>
  <desc id="utils-desc">规划中的 @codejoo/utils 函数工具按通用、数组、对象、字符串、数学五个模块组织，经统一入口具名导出，供各子项目按需使用；接口尚未实现。</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; text-anchor: middle; }
      .start { text-anchor: start; }
      .box { fill: #FDE8D0; stroke: #333; stroke-width: 2; }
      .box-api { fill: #E8F5E9; stroke: #333; stroke-width: 1.5; }
      .box-plugin { fill: #FFF9C4; stroke: #333; stroke-width: 1.5; }
      .text-title { font-size: 18px; font-weight: bold; }
      .text-label { font-size: 13px; }
      .text-head { font-size: 13px; font-weight: bold; }
      .text-small { font-size: 11px; }
      .text-api { font-size: 10px; font-family: 'Courier New', monospace; }
      .sep { stroke: #ccc; stroke-width: 1; }
      .sep-wide { stroke: #999; stroke-width: 1; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>

  <text x="700" y="30" class="text-title">@codejoo/utils 规划架构图</text>
  <text x="700" y="50" class="text-label">规划中，尚未实现 | 零依赖、可树摇的通用工具库</text>

  <!-- 应用调用 -->
  <rect x="50" y="100" width="240" height="120" class="box" rx="8"/>
  <text x="170" y="135" class="text-title">应用调用</text>
  <text x="170" y="155" class="text-label">按需具名导入</text>
  <text x="170" y="175" class="text-api">{ debounce, clamp, deepClone, ... }</text>

  <!-- 第一类：通用工具 -->
  <rect x="60" y="280" width="200" height="200" class="box-plugin" rx="5"/>
  <text x="160" y="310" class="text-head">通用工具</text>
  <text x="160" y="330" class="text-small">Common</text>
  <line x1="70" y1="340" x2="250" y2="340" class="sep"/>
  <text x="160" y="365" class="text-api">debounce(func, wait)</text>
  <text x="160" y="380" class="text-api">throttle(func, limit)</text>
  <text x="160" y="395" class="text-api">delay(ms)</text>
  <text x="160" y="410" class="text-api">getTypeName(value)</text>
  <text x="160" y="425" class="text-api">deepEqual(a, b)</text>

  <!-- 第二类：数组操作 -->
  <rect x="320" y="280" width="200" height="200" class="box-plugin" rx="5"/>
  <text x="420" y="310" class="text-head">数组操作</text>
  <text x="420" y="330" class="text-small">Array</text>
  <line x1="330" y1="340" x2="510" y2="340" class="sep"/>
  <text x="420" y="365" class="text-api">flatten(arr)</text>
  <text x="420" y="380" class="text-api">unique(arr)</text>
  <text x="420" y="395" class="text-api">groupBy(arr, key)</text>
  <text x="420" y="410" class="text-api">findFirst(arr, predicate)</text>

  <!-- 第三类：对象操作 -->
  <rect x="580" y="280" width="200" height="200" class="box-plugin" rx="5"/>
  <text x="680" y="310" class="text-head">对象操作</text>
  <text x="680" y="330" class="text-small">Object</text>
  <line x1="590" y1="340" x2="770" y2="340" class="sep"/>
  <text x="680" y="365" class="text-api">deepMerge(target, ...sources)</text>
  <text x="680" y="380" class="text-api">pick(obj, keys)</text>
  <text x="680" y="395" class="text-api">omit(obj, keys)</text>
  <text x="680" y="410" class="text-api">deepClone(obj)</text>

  <!-- 第四类：字符串处理 -->
  <rect x="840" y="280" width="200" height="200" class="box-plugin" rx="5"/>
  <text x="940" y="310" class="text-head">字符串处理</text>
  <text x="940" y="330" class="text-small">String</text>
  <line x1="850" y1="340" x2="1030" y2="340" class="sep"/>
  <text x="940" y="365" class="text-api">capitalize(str)</text>
  <text x="940" y="380" class="text-api">camelToSnake(str)</text>
  <text x="940" y="395" class="text-api">snakeToCamel(str)</text>
  <text x="940" y="410" class="text-api">interpolate(template, values)</text>

  <!-- 第五类：数学运算 -->
  <rect x="1100" y="280" width="200" height="200" class="box-plugin" rx="5"/>
  <text x="1200" y="310" class="text-head">数学运算</text>
  <text x="1200" y="330" class="text-small">Math</text>
  <line x1="1110" y1="340" x2="1290" y2="340" class="sep"/>
  <text x="1200" y="365" class="text-api">clamp(value, min, max)</text>
  <text x="1200" y="380" class="text-api">lerp(a, b, t)</text>
  <text x="1200" y="395" class="text-api">roundTo(value, decimals)</text>
  <text x="1200" y="410" class="text-api">mod(n, m)</text>

  <!-- 箭头向下 -->
  <path d="M 160 480 V 505 H 320 V 530" class="arrow"/>
  <path d="M 420 480 L 420 530" class="arrow"/>
  <path d="M 680 480 L 680 530" class="arrow"/>
  <path d="M 940 480 L 940 530" class="arrow"/>
  <path d="M 1200 480 V 505 H 1080 V 530" class="arrow"/>

  <!-- 导出聚合 -->
  <rect x="300" y="530" width="800" height="120" class="box-api" rx="8"/>
  <text x="700" y="570" class="text-title">统一导出</text>
  <text x="700" y="590" class="text-label">Unified Export</text>
  <line x1="310" y1="605" x2="1090" y2="605" class="sep-wide"/>
  <text x="320" y="625" class="text-api start">import { clamp } from '@codejoo/utils'</text>
  <text x="1000" y="625" class="text-api">tree-shakeable</text>

  <!-- 应用使用 -->
  <path d="M 700 650 L 700 700" class="arrow"/>

  <rect x="300" y="700" width="800" height="150" class="box" rx="8"/>
  <text x="700" y="740" class="text-title">应用集成</text>
  <text x="700" y="760" class="text-label">Application Integration</text>
  <line x1="310" y1="770" x2="1090" y2="770" class="sep-wide"/>
  <text x="700" y="795" class="text-api">Vue/React 组件中使用 | Node.js 服务端使用</text>
  <text x="700" y="820" class="text-api">零运行时依赖 | 体积待实现后实测</text>

  <text x="60" y="900" class="text-small start" font-weight="bold">规划体系：函数工具五模块（通用 / 数组 / 对象 / 字符串 / 数学）→ 统一导出 → 应用集成；类型工具、常量、全局声明见 packages/utils/ARCHITECTURE.md</text>
</svg>
