<!doctype html><html><head><meta charset="utf-8"><title>sync</title><link id="css" rel="stylesheet"><script src="./blob5.js"></script>
<style>html,body{margin:0;background:#fff}#root p{margin:0 0 6px;height:20px}#root{padding:4px 0}</style></head><body>
<div id="root" x-ske x-ske-engine="svg" x-ske-text="leaf"><p>a</p><p>b</p><p>c</p><p>d</p><p>e</p><p>f</p><p>g</p><p>h</p></div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById("css").href="./"+(q.get("css")||"base")+".css";
document.documentElement.setAttribute("data-x-ske-theme",q.get("theme")||"light");
document.getElementById("root").setAttribute("x-ske-effect",q.get("effect")||"shimmer");
if(q.get("blob")) window.cost=Blob5.apply(document.getElementById("root"));
window.ready=true;
</script></body></html>
