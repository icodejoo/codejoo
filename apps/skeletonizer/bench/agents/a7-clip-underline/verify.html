<!doctype html>
<html lang="zh"><head><meta charset="utf-8" /><title>verify-a7</title>
<style>
body{font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif;margin:0;padding:12px;background:#fff;color:#111}
html[data-skz-theme=dark] body{background:#111827;color:#e5e7eb}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:900px}
.card{display:flex;gap:8px;padding:8px;border:1px solid #8884}.card img{width:48px;height:48px;border-radius:50%}
.card h3{margin:0 0 4px}.card small{display:block}.card p{margin:4px 0}.card button{font:inherit;padding:4px 10px;margin-top:4px}
.box{border:1px dashed #8886;padding:8px;margin-top:8px}
</style></head><body><div id="root"></div>
<script type="module">
// 参数：mode=base|clip|clipnp|explicit  engine=global|svg  effect=shimmer|pulse  theme=dark|light  text=leaf
const q = new URLSearchParams(location.search);
const mode = q.get("mode") || "base", engine = q.get("engine") || "global", effect = q.get("effect") || "shimmer";
document.documentElement.setAttribute("data-skz-theme", q.get("theme") || "light");
const DIST = "../../../dist/";
const css = [mode === "explicit" ? "explicit" : "base", "global", "svg", ...(["clip","clipall","clipnp"].includes(mode) ? ["LOCAL:clip"] : []), ...(mode === "clipall" ? ["LOCAL:clipall"] : []), ...(mode === "clipnp" ? ["LOCAL:clipnp"] : [])];
await Promise.all(css.map((n) => new Promise((res) => { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = n.startsWith("LOCAL:") ? `./${n.slice(6)}.css` : `${DIST}${n}.css`; l.onload = l.onerror = res; document.head.appendChild(l); })));
const { Bone, enable } = await import(DIST + "index.mjs");
await import(DIST + (engine === "svg" ? "svg-js.mjs" : "global-js.mjs"));
const B = mode === "explicit" ? " skz-bone" : "";
const GIF = Bone.image();
const card = (i) => `<div class="card"><img${B} src="${GIF}" alt=""><div><h3${B}>标题 Typography gypq ${i}</h3><small${B}>small 小字 gjpqy</small><p${B}>这是一段会换行的真实文字，用来看每一行骨架条是否被光带填充，最后一行应当较短。This paragraph wraps over several lines with descenders gypqj.</p><p${B}>价格：<b>¥5</b> 元起，包邮 gypq</p><i${B} class="icon-star"></i> <button${B}>按钮 Button</button><div id="rawdiv">裸 div 文本 gypq <code>code 片段</code></div></div></div>`;
const root = document.getElementById("root");
root.innerHTML = `<div class="grid" id="g">${card(1)}${card(2)}</div>
<div class="box" id="ign" skz-ignore><p>skz-ignore 区域：我应当保持原样 gypq</p><button>ignore btn</button></div>
<div class="box" id="leaf" skz-leaf><p>skz-leaf 区域文字 gypq</p><span>leaf span</span></div>
<div class="box"><h3 id="bone" skz-bone>skz-bone 的 h3 gypq</h3></div>`;
window.opts = { effect, engine, ...(q.get("text") ? { text: q.get("text") } : {}) };
window.off = enable(root, window.opts);
await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
await new Promise((r) => setTimeout(r, 600));
window.ready = true;
</script></body></html>
